        function loadDataFromStorage() {
            dbCache.employees = JSON.parse(localStorage.getItem(appId + '_employees')) || [];
            dbCache.departments = JSON.parse(localStorage.getItem(appId + '_departments')) || [];
            dbCache.attendance = JSON.parse(localStorage.getItem(appId + '_attendance')) || [];
            dbCache.leaves = JSON.parse(localStorage.getItem(appId + '_leaves')) || [];
            dbCache.payroll = JSON.parse(localStorage.getItem(appId + '_payroll')) || [];
            dbCache.tasks = JSON.parse(localStorage.getItem(appId + '_tasks')) || [];
            dbCache.announcements = JSON.parse(localStorage.getItem(appId + '_announcements')) || [];
        }

        function saveData(key) {
            localStorage.setItem(appId + '_' + key, JSON.stringify(dbCache[key]));
        }

        // --- Auth Controllers ---
        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 text-slate-900 dark:text-white shadow-sm transition';
                document.getElementById('tab-register').className = 'flex-1 py-2 text-sm font-semibold text-slate-500 dark:text-slate-400 rounded-lg transition';
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('tab-register').className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 text-slate-900 dark:text-white shadow-sm transition';
                document.getElementById('tab-login').className = 'flex-1 py-2 text-sm font-semibold text-slate-500 dark:text-slate-400 rounded-lg transition';
            }
        }

        function fillDemoCredentials(type) {
            if (type === 'admin') {
                document.getElementById('login-email').value = 'admin@nexus.com';
                document.getElementById('login-password').value = 'admin123';
            } else {
                document.getElementById('login-email').value = 'marcus@nexus.com';
                document.getElementById('login-password').value = 'emp123';
            }
            showToast('Demo credentials filled successfully!', 'success');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            
            const emp = dbCache.employees.find(e => e.email.toLowerCase() === email.toLowerCase());
            if (emp) {
                currentUser = emp;
                showToast(`Welcome back, ${currentUser.fname}!`, 'success');
                renderMainLayout();
            } else {
                showToast('Invalid email or password. Try demo credentials.', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const fname = document.getElementById('reg-fname').value;
            const lname = document.getElementById('reg-lname').value;
            const email = document.getElementById('reg-email').value;
            const dept = document.getElementById('reg-dept').value;

            const newEmp = {
                id: 'EMP-' + (1000 + dbCache.employees.length + 1),
                fname,
                lname,
                email,
                role: 'employee',
                dept,
                designation: 'Associate',
                salary: 75000,
                status: 'Active',
                joiningDate: new Date().toISOString().split('T')[0],
                phone: '+1 (555) 000-0000',
                avatar: `https://images.unsplash.com/photo-${1500000000000 + Math.floor(Math.random()*100000)}?w=150`
            };

            dbCache.employees.push(newEmp);
            saveData('employees');
            currentUser = newEmp;
            showToast('Account registered successfully!', 'success');
            renderMainLayout();
        }

        function logout() {
            currentUser = null;
            location.reload();
        }

        // --- Toast Notifications ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-brand-600';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto text-sm font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

                leaves: 'Leave Management',
                payroll: 'Payroll & Salary Management',
                tasks: 'Tasks & Projects',
                reports: 'Reports & Analytics & PDF Export'

            document.getElementById('page-title').innerText = titles[view] || 'Dashboard';

            if (view === 'dashboard') renderDashboardView();

            else if (view === 'reports') renderReportsView();
        }

            e.preventDefault();
            const newEmp = {

                fname: document.getElementById('new-emp-fname').value,
                lname: document.getElementById('new-emp-lname').value,
                email: document.getElementById('new-emp-email').value,
                phone: document.getElementById('new-emp-phone').value,
                dept: document.getElementById('new-emp-dept').value,
                designation: document.getElementById('new-emp-desig').value,
                salary: parseFloat(document.getElementById('new-emp-salary').value),
                status: document.getElementById('new-emp-status').value,
                role: 'employee',
                joiningDate: new Date().toISOString().split('T')[0],
                avatar: `https://images.unsplash.com/photo-${1500000000000 + Math.floor(Math.random()*100000)}?w=150`
            };

            dbCache.employees.push(newEmp);
            saveData('employees');
            closeModal();
            showToast('Employee added successfully!', 'success');
            renderEmployeesView();
        }

        // Real PDF Generator using jsPDF
        function downloadReportPDF(title) {
            showToast(`Generating ${title}...`, 'info');
            setTimeout(() => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFillColor(79, 70, 229);
                doc.rect(0, 0, 210, 30, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(18);
                doc.text('NexusHR Enterprise Management', 14, 18);

                doc.setTextColor(50, 50, 50);
                doc.setFontSize(14);
                doc.text(title, 14, 45);

                doc.setFontSize(10);
                doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 53);
                doc.text(`Generated by: ${currentUser.fname} ${currentUser.lname} (${currentUser.role})`, 14, 59);

                doc.setDrawColor(200, 200, 200);
                doc.line(14, 65, 196, 65);

                let y = 75;
                if (title.includes('Employee')) {
                    dbCache.employees.forEach((e, idx) => {
                        if (y > 270) { doc.addPage(); y = 20; }
                        doc.text(`${idx + 1}. ${e.fname} ${e.lname} - ${e.dept} (${e.designation}) - Salary: $${e.salary.toLocaleString()}`, 14, y);
                        y += 10;
                    });
                } else if (title.includes('Attendance')) {
                    dbCache.attendance.forEach((a, idx) => {
                        if (y > 270) { doc.addPage(); y = 20; }
                        doc.text(`${idx + 1}. ${a.name} - Date: ${a.date} - In: ${a.checkIn} - Status: ${a.status}`, 14, y);
                        y += 10;
                    });
                } else {
                    dbCache.payroll.forEach((p, idx) => {
                        if (y > 270) { doc.addPage(); y = 20; }
                        doc.text(`${idx + 1}. ${p.name} - ${p.month} - Net Pay: $${p.net.toLocaleString()} (${p.status})`, 14, y);
                        y += 10;
                    });
                }

                doc.save(`${title.toLowerCase().replace(/\s+/g, '_')}.pdf`);
                showToast('PDF downloaded successfully to your device!', 'success');
            }, 800);
        }

        function downloadPayslipPDF(payId) {
            const pay = dbCache.payroll.find(p => p.id === payId);
            if (!pay) return;
            showToast('Generating official payslip PDF...', 'info');
            setTimeout(() => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFillColor(79, 70, 229);
                doc.rect(0, 0, 210, 35, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(20);
                doc.text('NexusHR Enterprise Payslip', 14, 22);

                doc.setTextColor(50, 50, 50);
                doc.setFontSize(12);
                doc.text(`Employee Name: ${pay.name}`, 14, 50);
                doc.text(`Payment Cycle: ${pay.month}`, 14, 58);
                doc.text(`Status: ${pay.status}`, 14, 66);

                doc.line(14, 75, 196, 75);

                doc.text(`Base Salary: $${pay.base.toLocaleString()}`, 14, 90);
                doc.text(`Bonus Allowance: +$${pay.bonus.toLocaleString()}`, 14, 100);
                doc.text(`Statutory Deductions: -$${pay.deduction.toLocaleString()}`, 14, 110);

                doc.setFontSize(14);
                doc.setTextColor(79, 70, 229);
                doc.text(`Net Disbursement: $${pay.net.toLocaleString()}`, 14, 130);

                doc.save(`payslip_${pay.name.toLowerCase().replace(/\s+/g, '_')}.pdf`);
                showToast('Payslip PDF downloaded successfully!', 'success');
            }, 600);
        }

        function exportEmployeesCSV() {
            let csv = 'ID,First Name,Last Name,Email,Department,Designation,Salary,Status\n';
            dbCache.employees.forEach(e => {
                csv += `${e.id},${e.fname},${e.lname},${e.email},${e.dept},${e.designation},${e.salary},${e.status}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'employee_directory.csv');
            a.click();
            showToast('CSV export successful!', 'success');
        }

        // --- Utility Modals ---
        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }

        function showAddAnnouncementModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.innerHTML = `
                <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-4">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Post Announcement</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="handlePostAnnouncement(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase mb-1">Title</label>
                            <input type="text" id="ann-title" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase mb-1">Content</label>
                            <textarea id="ann-content" rows="4" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm"></textarea>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-sm font-medium">Cancel</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-semibold shadow">Post Announcement</button>
                        </div>
                    </form>
                </div>
            `;
        }

        function handlePostAnnouncement(e) {
            e.preventDefault();
            const ann = {
                id: 'ANN-' + (dbCache.announcements.length + 1),
                title: document.getElementById('ann-title').value,
                date: new Date().toISOString().split('T')[0],
                author: currentUser.fname + ' ' + currentUser.lname,
                content: document.getElementById('ann-content').value
            };
            dbCache.announcements.unshift(ann);
            localStorage.setItem(appId + '_announcements', JSON.stringify(dbCache.announcements));
            closeModal();
            showToast('Announcement posted successfully!', 'success');
            renderDashboardView();
        }

        function showAddTaskModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.innerHTML = `
                <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-4">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Assign New Task</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="handleAddTask(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase mb-1">Task Title</label>
                            <input type="text" id="task-title" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase mb-1">Assignee</label>
                            <select id="task-assignee" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm">
                                ${dbCache.employees.map(e => `<option value="${e.fname} ${e.lname}">${e.fname} ${e.lname}</option>`).join('')}
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase mb-1">Due Date</label>
                                <input type="date" id="task-due" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase mb-1">Priority</label>
                                <select id="task-priority" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm">
                                    <option value="Normal">Normal</option>
                                    <option value="High">High</option>
                                    <option value="Urgent">Urgent</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-sm font-medium">Cancel</button>
                            <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-semibold shadow">Assign Task</button>
                        </div>
                    </form>
                </div>
            `;
        }

        function handleAddTask(e) {
            e.preventDefault();
            const task = {
                id: 'TSK-' + (dbCache.tasks.length + 1),
                title: document.getElementById('task-title').value,
                assignee: document.getElementById('task-assignee').value,
                due: document.getElementById('task-due').value,
                priority: document.getElementById('task-priority').value,
                status: 'Pending'
            };
            dbCache.tasks.unshift(task);
            localStorage.setItem(appId + '_tasks', JSON.stringify(dbCache.tasks));
            closeModal();
            showToast('Task assigned successfully!', 'success');
            renderTasksView();
        }

        function toggleTaskStatus(id) {
            const t = dbCache.tasks.find(ts => ts.id === id);
            if (t) {
                t.status = t.status === 'Completed' ? 'Pending' : 'Completed';
                localStorage.setItem(appId + '_tasks', JSON.stringify(dbCache.tasks));
                showToast('Task status updated!', 'success');
                renderTasksView();
            }
        }

        function showForgotPasswordModal() {
            showToast('Password reset link sent to registered email address.', 'success');
        }

        function toggleNotificationPanel() {
            showToast('No new unread notification alerts.', 'info');
        }

        // Initialize App on Window Load
        window.onload = function() {
            initializeDefaultData();
        };
    </script>
</body>
</html>
